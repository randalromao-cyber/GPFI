.btns{padding:9px 16px;border-radius:7px;background:#f1f5f9;color:#334155;font-weight:700;font-size:13px;border:1px solid #e2e8f0;cursor:pointer}

.load-screen{min-height:100vh;background:#f0f4f8;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}

<script>
const {createElement:h,useState,useEffect,useCallback,Fragment}=React;

// ── SUPABASE ──────────────────────────────────────────────────────────────────
const SB_URL="https://laelsnqvajpbhmaeshoa.supabase.co/rest/v1";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhZWxzbnF2YWpwYmhtYWVzaG9hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4MDI0OTQsImV4cCI6MjA5MjM3ODQ5NH0.voyevlz2pywjM9pZFpj_AgwJhrsGSNTg4092GfBHn4o";
const HDR={"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Accept":"application/json"};
async function sb(method,table,params,body){
  const url=SB_URL+"/"+table+(params?"?"+params:"");
  const hh={...HDR};
  if(method==="POST"||method==="PATCH")hh["Prefer"]="return=representation";
  if(method==="POST"&&params&&params.includes("on_conflict"))hh["Prefer"]="resolution=merge-duplicates,return=representation";
  const r=await fetch(url,{method,headers:hh,...(body?{body:JSON.stringify(body)}:{})});
  if(!r.ok){const t=await r.text();throw new Error(r.status+": "+t);}
  if(method==="DELETE")return[];
  const txt=await r.text();return txt?JSON.parse(txt):[];
}

// ── SEGURANÇA ─────────────────────────────────────────────────────────────────
function sanitize(s){if(typeof s!=="string")return s;return s.replace(/[<>"'`]/g,c=>({"<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#x27;","`":"&#x60;"}[c]));}
const SQL_PAT=/(\b(select|insert|update|delete|drop|truncate|alter|exec|union)\b.*[=<>]|--|;|\/\*|\*\/)/i;
function isSafe(v){return typeof v!=="string"||!SQL_PAT.test(v);}
async function hashSenha(s){const e=new TextEncoder().encode(s);const b=await crypto.subtle.digest("SHA-256",e);return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");}

// ── CONSTANTES ────────────────────────────────────────────────────────────────
const VB=7512.03,VPCT=0.000333,MINP=1000,MAXP=3000,MAXE=1000;
const MESES=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
const UNID_COR={GFI:"#1d4ed8",GFM:"#7c3aed",GCF:"#059669",GATIF:"#d97706",DAC:"#0891b2",GA:"#be185d",GAT:"#0d9488",DT:"#dc2626",ADMIN:"#64748b"};
const ROLE_LBL={admin:"Admin",diretor:"Diretor",gerente:"Gerente",encarregado:"Encarregado",colaborador:"Auditor"};
const SCOR={pend:"#f59e0b",ap_enc:"#3b82f6",ap_ger:"#10b981",rej:"#ef4444"};
const SLBL={pend:"Aguard. Encarregado",ap_enc:"Aguard. Gerente",ap_ger:"Aprovado ✓",rej:"Rejeitado"};
const UNIDS=["GFI","GFM","GCF","GATIF","DAC","GA","GAT","DT","ADMIN"];
const COM_QTD=["c31","c41","c42","c44","c45","c49","c50"];

const CAT=[
  {id:"c01",item:"1",   pts:300,desc:"Informações tributárias – mandado de segurança / ações judiciais"},
  {id:"c02",item:"2.1", pts:120,desc:"Serviço fiscal básico – 1 exercício"},
  {id:"c03",item:"2.2", pts:140,desc:"Serviço fiscal básico – 2 exercícios"},
  {id:"c04",item:"2.3", pts:170,desc:"Serviço fiscal básico – 3 exercícios"},
  {id:"c05",item:"2.4", pts:200,desc:"Serviço fiscal básico – 4+ exercícios"},
  {id:"c06",item:"3.1", pts:10, desc:"Verificação – livros contábeis (por exercício)"},
  {id:"c07",item:"3.2", pts:20, desc:"Verificação – relatórios em geral"},
  {id:"c08",item:"3.3", pts:2,  desc:"Verificação – memorandos"},
  {id:"c09",item:"3.4", pts:5,  desc:"Verificação – contratos"},
  {id:"c10",item:"4.1", pts:130,desc:"Arbitramento – não atendimento / notificação"},
  {id:"c11",item:"4.2", pts:145,desc:"Arbitramento – documentos sem condição de conclusão"},
  {id:"c12",item:"4.3", pts:150,desc:"Cálculo por estimativa"},
  {id:"c13",item:"5",   pts:20, desc:"Diligências por contribuinte"},
  {id:"c14",item:"6.1", pts:10, desc:"Autorização – inscrição/alteração/cancelamento"},
  {id:"c15",item:"6.2", pts:10, desc:"Autorização – enquadramento de atividade"},
  {id:"c16",item:"7.1", pts:20, desc:"Notificação / intimação"},
  {id:"c17",item:"7.2", pts:20, desc:"Termo de apreensão"},
  {id:"c18",item:"7.3", pts:20, desc:"Auto de infração"},
  {id:"c19",item:"8.1", pts:200,desc:"Manifestação definitiva – pesquisa doutrina/jurisprudência"},
  {id:"c20",item:"8.2", pts:100,desc:"Manifestação definitiva – fundamentação legal"},
  {id:"c21",item:"9.1", pts:250,desc:"Informações fundamentadas – consulta jurídico-tributária"},
  {id:"c22",item:"9.2", pts:100,desc:"Informações fundamentadas – imunidade/isenção"},
  {id:"c23",item:"9.3", pts:60, desc:"Informações fundamentadas – Regime Especial"},
  {id:"c24",item:"9.4", pts:20, desc:"Pontuação adicional – defesa/recurso"},
  {id:"c25",item:"10.1",pts:150,desc:"Fiscalização especial – diurna (jornada integral)"},
  {id:"c26",item:"10.2",pts:75, desc:"Fiscalização especial – período parcial"},
  {id:"c27",item:"10.3",pts:195,desc:"Fiscalização especial – noturna"},
  {id:"c28",item:"10.4",pts:300,desc:"Fiscalização – feriados ou finais de semana"},
  {id:"c29",item:"11.1",pts:150,desc:"Conferência DIPAM – jornada integral"},
  {id:"c30",item:"11.2",pts:75, desc:"Conferência DIPAM – período parcial"},
  {id:"c31",item:"12.1",pts:20, desc:"Emissão/cancelamento – Demonstrativo de Recolhimento"},
  {id:"c32",item:"13.1",pts:50, desc:"Verificação subempreitada – construção civil"},
  {id:"c33",item:"13.2",pts:15, desc:"Levantamento fiscal – mão-de-obra própria"},
  {id:"c34",item:"14",  pts:75, desc:"Comissões / grupos de trabalho – sem prejuízo"},
  {id:"c35",item:"15",  pts:150,desc:"Comissões / grupos de trabalho – com prejuízo"},
  {id:"c36",item:"16.1",pts:150,desc:"Plantão fiscal – jornada integral"},
  {id:"c37",item:"16.2",pts:75, desc:"Plantão fiscal – período parcial"},
  {id:"c38",item:"17",  pts:300,desc:"Elaboração de parecer técnico-científico"},
  {id:"c39",item:"18",  pts:50, desc:"Monitoramento tomadores/prestadores"},
  {id:"c40",item:"19",  pts:20, desc:"Inclusão/alteração/exclusão cadastral"},
  {id:"c41",item:"20.1",pts:20, desc:"Vistoria – dados proprietário (por UA)"},
  {id:"c42",item:"20.2",pts:30, desc:"Vistoria – Tipo/Padrão Construtivo (por UA)"},
  {id:"c43",item:"20.3",pts:15, desc:"Vistoria – Área Construída (por m²)",esp:"m2"},
  {id:"c44",item:"21.1",pts:20, desc:"Vistoria p/ processo – dados proprietário (por UA)"},
  {id:"c45",item:"21.2",pts:30, desc:"Vistoria p/ processo – Tipo/Padrão (por UA)"},
  {id:"c46",item:"21.3",pts:15, desc:"Vistoria p/ processo – Área Construída (por m²)",esp:"m2"},
  {id:"c47",item:"21.4",pts:25, desc:"Vistoria p/ processo – confirmação de dados (por UA)"},
  {id:"c48",item:"22.1",pts:20, desc:"Despacho/ficha – Cadastro Imobiliário Fiscal"},
  {id:"c49",item:"22.2",pts:20, desc:"Desdobro/Englobamento – criação das unidades"},
  {id:"c50",item:"22.3",pts:40, desc:"Desdobro/Englobamento – dados avaliativos"},
  {id:"c51",item:"22.4",pts:40, desc:"Identificação sujeito passivo IPTU"},
  {id:"c52",item:"23.1",pts:1,  desc:"Notificação ISSCC – a cada 50 FMPs lançados",esp:"fmp"},
  {id:"c53",item:"24",  pts:10, desc:"Ficha de Lançamento / sistemas informatizados"},
  {id:"c54",item:"25",  pts:150,desc:"Pesquisa de Valores Imobiliários (por UA)"},
  {id:"c55",item:"26",  pts:0,  desc:"Estorno em dobro – lavratura indevida ou injustificada",esp:"estorno"},
];

// ── HELPERS ───────────────────────────────────────────────────────────────────
function getComp(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function fmtComp(c){const[y,m]=c.split("-");return MESES[+m-1]+"/"+y;}
function fmtBRL(v){return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function genId(){return"u_"+Math.random().toString(36).slice(2,8);}

function calcPts(cid,f){
  const c=CAT.find(x=>x.id===cid);if(!c)return 0;
  if(c.esp==="estorno")return-(parseInt(f.estorno)||0);
  if(c.esp==="m2"){const d=(parseFloat(f.m2b)||0)-(parseFloat(f.m2a)||0);return d>0?Math.round(d*c.pts):0;}
  if(c.esp==="fmp"){const t=parseFloat(f.ft)||0,v=parseFloat(f.fv)||0;return v?Math.floor((t/v)/50)*c.pts:0;}
  return c.pts*(parseInt(f.qtd)||1);
}
function calcRes(base,exc){
  const total=base+exc;
  if(total<MINP)return{total,ef:0,exc:0};
  return{total,ef:Math.min(total,MAXP),exc:Math.min(Math.max(total-MAXP,0),MAXE)};
}
function gpfi(ef,vb){return ef*vb*VPCT;}
function toUser(r){return{id:r.id,nome:r.nome,mat:r.mat,email:r.email,cargo:r.cargo,role:r.role,unid:r.unid,vb:parseFloat(r.vb),pw:r.pw,ativo:r.ativo,sup_id:r.sup_id||null};}
function toTrf(r){return{id:r.id,uid:r.user_id,comp:r.comp,cid:r.cat_id,desc:r.descricao,pts:r.pts,qtd:r.qtd,data:r.data,obs:r.obs,status:r.status,m2a:r.m2_atual,m2b:r.m2_nova,ft:r.fmp_tot,fv:r.fmp_val};}

// ── MINI COMPONENTS ───────────────────────────────────────────────────────────
function Bdg({lbl,cor}){return h("span",{className:"badge",style:{background:cor+"18",color:cor,border:"1px solid "+cor+"30"}},lbl);}
function KCard({icon,lbl,val,cor,sub}){return h("div",{className:"kcard",style:{borderLeft:"4px solid "+cor}},h("div",{style:{fontSize:20,marginBottom:4}},icon),h("div",{style:{fontSize:19,fontWeight:900,color:cor}},val),h("div",{style:{fontSize:11,color:"#64748b",marginTop:2}},lbl),sub&&h("div",{style:{fontSize:10,color:"#94a3b8"}},sub));}
function Notif({n}){return n?h("div",{className:"notif",style:{background:n.t==="ok"?"#16a34a":"#dc2626"}},n.m):null;}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const[users,setU]=useState([]);
  const[trfs,setT]=useState([]);
  const[exc,setE]=useState({});
  const[comps,setC]=useState({});
  const[comp,setComp]=useState(getComp());
  const[user,setUser]=useState(null);
  const[tab,setTab]=useState("dash");
  const[lf,setLF]=useState({email:"",pw:""});
  const[le,setLE]=useState("");
  const[load,setLoad]=useState(true);
  const[lmsg,setLmsg]=useState("Conectando...");
  const[notif,setN]=useState(null);
  const[logging,setLogging]=useState(false);

  const notify=(m,t="ok")=>{setN({m,t});setTimeout(()=>setN(null),3000);};

  useEffect(()=>{
    (async()=>{
      try{
        setLmsg("Carregando usuários...");
        const us=await sb("GET","usuarios","order=nome");
        if(Array.isArray(us))setU(us.map(toUser));
        setLmsg("Carregando tarefas...");
        const ts=await sb("GET","tarefas","order=criado_em.desc");
        if(Array.isArray(ts))setT(ts.map(toTrf));
        setLmsg("Finalizando...");
        const[exs,cfg,cps]=await Promise.all([sb("GET","excedentes"),sb("GET","config","chave=eq.comp_ativa"),sb("GET","competencias")]);
        if(Array.isArray(exs)){const em={};exs.forEach(e=>{em[e.user_id+"_"+e.comp]=e.valor;});setE(em);}
        if(Array.isArray(cfg)&&cfg.length)setComp(cfg[0].valor);
        if(Array.isArray(cps)){const cm={};cps.forEach(c=>{if(!cm[c.comp])cm[c.comp]={};cm[c.comp][c.user_id]={ef:c.efetivos,exc:c.excedente,total:c.total};});setC(cm);}
      }catch(e){alert("Erro ao conectar: "+e.message);}
      setLoad(false);
    })();
  },[]);

  const getBase=useCallback((uid,c)=>trfs.filter(t=>t.uid===uid&&t.comp===c&&t.status==="ap_ger").reduce((s,t)=>s+t.pts,0),[trfs]);
  const getExc=useCallback((uid,c)=>exc[uid+"_"+c]||0,[exc]);
  const getR=useCallback((uid,c)=>calcRes(getBase(uid,c),getExc(uid,c)),[getBase,getExc]);
  const cols=useCallback(()=>users.filter(u=>u.role==="colaborador"&&u.ativo),[users]);
  const mediaAptos=useCallback((c)=>{const a=cols().filter(u=>getR(u.id,c).ef>=MINP);return a.length?Math.round(a.reduce((s,u)=>s+getR(u.id,c).ef,0)/a.length):0;},[cols,getR]);
  const myCols=useCallback(()=>{
    if(!user)return[];
    if(user.role==="admin"||user.role==="diretor")return cols();
    if(user.role==="gerente"||user.role==="encarregado")return users.filter(u=>u.role==="colaborador"&&u.unid===user.unid&&u.ativo);
    return[];
  },[user,users,cols]);
  const pends=useCallback(()=>{
    if(!user)return[];
    if(user.role==="encarregado")return trfs.filter(t=>{const u=users.find(x=>x.id===t.uid);return u&&u.unid===user.unid&&t.status==="pend"&&u.sup_id===user.id;});
    if(user.role==="gerente")return trfs.filter(t=>{const u=users.find(x=>x.id===t.uid);return u&&u.unid===user.unid&&(t.status==="pend"||t.status==="ap_enc");});
    return[];
  },[user,trfs,users]);

  async function doLogin(){
    if(!lf.email.trim()||!lf.pw.trim()){setLE("Preencha o e-mail e a senha.");return;}
    if(!lf.email.trim().toLowerCase().endsWith("@santoandre.sp.gov.br")){setLE("Acesso permitido apenas para @santoandre.sp.gov.br.");return;}
    if(!isSafe(lf.email)||!isSafe(lf.pw)){setLE("Entrada inválida.");return;}
    setLogging(true);
    try{
      const u=users.find(x=>x.email.toLowerCase()===lf.email.trim().toLowerCase());
      if(!u){setLE("Usuário não encontrado.");setLogging(false);return;}
      const hashed=await hashSenha(lf.pw);
      const ok=(u.pw===hashed||u.pw===lf.pw);
      if(!ok){setLE("Senha incorreta.");setLogging(false);return;}
      if(u.pw===lf.pw&&u.pw!==hashed){
        await sb("PATCH","usuarios","id=eq."+u.id,{pw:hashed});
        setU(p=>p.map(x=>x.id===u.id?{...x,pw:hashed}:x));
        u.pw=hashed;
      }
      setUser(u);setLE("");setTab("dash");
    }catch(e){setLE("Erro ao autenticar.");}
    setLogging(false);
  }

  if(load)return h("div",{className:"load-screen"},h("div",{className:"spinner",style:{width:48,height:48}}),h("span",{style:{color:"#64748b",fontSize:14}},lmsg));

  if(!user)return h("div",{className:"login-screen"},
    h("div",{style:{width:"100%",maxWidth:420,textAlign:"center"}},

function Trfs({user,trfs,setT,comp,notify}){

  const[show,setShow]=useState(false);
  const[form,setForm]=useState(F0);
  const[sav,setSav]=useState(false);
  const cat=CAT.find(c=>c.id===form.cid);
  const pts=cat?calcPts(form.cid,form):0;
  const sf=(k,v)=>setForm(f=>({...f,[k]:v}));
  const mine=trfs.filter(t=>t.uid===user.id&&t.comp===comp);
  const temQtd=cat&&(COM_QTD.includes(cat.id)||(!cat.esp));

  async function add(){
    if(!form.cid){notify("Selecione um item.","err");return;}
    if(!form.obs.trim()){notify("Observação é obrigatória.","err");return;}
    if(pts===0&&cat.esp!=="estorno"){notify("Pontuação zero.","err");return;}
    setSav(true);
    try{
      const row={id:"t"+Date.now(),user_id:user.id,comp,cat_id:form.cid,descricao:cat.item+" – "+cat.desc,pts,qtd:parseInt(form.qtd)||1,data:form.data,obs:form.obs,status:"pend",m2_atual:form.m2a||null,m2_nova:form.m2b||null,fmp_tot:form.ft||null,fmp_val:form.fv||null};

      setT(p=>[toTrf(t),...p]);setForm(F0);setShow(false);notify("Tarefa registrada!");
    }catch(e){notify("Erro: "+e.message,"err");}
    setSav(false);
  }
  async function del(id){
    if(trfs.find(t=>t.id===id)?.status!=="pend"){notify("Só pendentes podem ser removidas.","err");return;}

        cat&&cat.esp==="m2"&&h("div",{className:"g2"},
          h("div",{className:"field"},h("label",{className:"lbl"},"Área Atual (m²)"),h("input",{type:"number",step:"0.01",value:form.m2a,onChange:e=>sf("m2a",e.target.value)})),
          h("div",{className:"field"},h("label",{className:"lbl"},"Área Nova (m²)"),h("input",{type:"number",step:"0.01",value:form.m2b,onChange:e=>sf("m2b",e.target.value)}))

          h("div",{className:"field"},h("label",{className:"lbl"},"Total em R$"),h("input",{type:"number",step:"0.01",value:form.ft,onChange:e=>sf("ft",e.target.value)})),
          h("div",{className:"field"},h("label",{className:"lbl"},"Valor do FMP (R$)"),h("input",{type:"number",step:"0.01",value:form.fv,onChange:e=>sf("fv",e.target.value)}))

          h("div",{className:"field"},h("label",{className:"lbl"},"Observação ",h("span",{style:{color:"#dc2626"}},"*")),h("textarea",{value:form.obs,onChange:e=>sf("obs",e.target.value),placeholder:"Preenchimento obrigatório..."})),
          pts!==0&&h("div",{style:{padding:"8px 10px",background:"#f8fafc",borderRadius:7,display:"flex",justifyContent:"space-between",marginBottom:10,border:"1px solid #e2e8f0"}},

// ── VALIDAÇÃO ─────────────────────────────────────────────────────────────────
function Val({user,trfs,setT,users,pends,notify}){
  const[obs,setObs]=useState({});
  const[selCol,setSelCol]=useState("todos");
  const ps=pends();
  const uMap=Object.fromEntries(users.map(u=>[u.id,u]));
  const colsComPend=[...new Set(ps.map(t=>t.uid))].map(uid=>uMap[uid]).filter(Boolean);
  const psFilt=selCol==="todos"?ps:ps.filter(t=>t.uid===selCol);

  async function acao(id,tipo){
    const ns=tipo==="ap"?(user.role==="encarregado"?"ap_enc":"ap_ger"):"rej";
    const body=tipo==="ap"?{status:ns}:{status:"rej",motivo_rej:obs[id]||"Sem motivo."};
    try{await sb("PATCH","tarefas","id=eq."+id,body);setT(p=>p.map(t=>t.id!==id?t:{...t,status:ns}));notify(tipo==="ap"?"Aprovado!":"Rejeitado.",tipo==="ap"?"ok":"err");}
    catch{notify("Erro.","err");}
  }
  async function acaoTodas(tipo){
    if(!psFilt.length)return;
    const ns=tipo==="ap"?(user.role==="encarregado"?"ap_enc":"ap_ger"):"rej";
    for(const t of psFilt){
      const body=tipo==="ap"?{status:ns}:{status:"rej",motivo_rej:"Rejeitado em lote."};
      try{await sb("PATCH","tarefas","id=eq."+t.id,body);}catch{}
    }
    setT(p=>p.map(t=>psFilt.find(x=>x.id===t.id)?{...t,status:ns}:t));
    notify(psFilt.length+" tarefas "+(tipo==="ap"?"aprovadas":"rejeitadas")+"!",tipo==="ap"?"ok":"err");
  }

  return h("div",null,
    h("h2",{className:"ph"},"Validação de Tarefas"),
    h("div",{className:"card",style:{padding:"12px 16px",marginBottom:12}},
      h("div",{style:{display:"flex",gap:10,alignItems:"flex-end",flexWrap:"wrap"}},
        h("div",{style:{flex:1,minWidth:200}},
          h("label",{className:"lbl"},"Filtrar por Colaborador"),
          h("select",{value:selCol,onChange:e=>setSelCol(e.target.value)},
            h("option",{value:"todos"},"Todos — "+ps.length+" pendente(s)"),
            colsComPend.map(u=>h("option",{key:u.id,value:u.id},u.nome+" ("+ps.filter(t=>t.uid===u.id).length+")"))
          )
        ),
        selCol!=="todos"&&h(Fragment,null,
          h("button",{className:"btn",style:{fontSize:12,padding:"8px 14px"},onClick:()=>acaoTodas("ap")},"✓ Aprovar Todas"),
          h("button",{className:"btnd",style:{fontSize:12,padding:"8px 14px"},onClick:()=>acaoTodas("rej")},"✗ Rejeitar Todas")
        )
      )
    ),
    psFilt.length===0&&h("div",{className:"card",style:{padding:20,textAlign:"center",color:"#94a3b8"}},"✅ Nenhuma pendência."),
    psFilt.map(t=>{const col=uMap[t.uid],cat=CAT.find(c=>c.id===t.cid);return h("div",{key:t.id,className:"card",style:{padding:14,marginBottom:10}},
      h("div",{style:{fontWeight:700,fontSize:13,marginBottom:4}},"Item "+(cat?cat.item:"—")+" — "+t.desc),
      h("div",{style:{fontSize:12,color:"#64748b",marginBottom:8}},h("b",{style:{color:"#1e293b"}},col?col.nome:"—")," • "+t.data+" • ",h("b",{style:{color:"#1d4ed8"}},t.pts+" pts")," • ",h(Bdg,{lbl:SLBL[t.status],cor:SCOR[t.status]})),
      t.obs&&h("div",{style:{fontSize:11,padding:"6px 10px",background:"#f8fafc",borderRadius:6,border:"1px solid #e2e8f0",marginBottom:8}},"📝 "+t.obs),
      h("div",{style:{display:"flex",gap:8,flexWrap:"wrap"}},
        h("input",{placeholder:"Observação do validador...",style:{flex:1,minWidth:160,fontSize:12},value:obs[t.id]||"",onChange:e=>setObs(p=>({...p,[t.id]:e.target.value}))}),
        h("button",{className:"btn",style:{fontSize:12,padding:"7px 14px"},onClick:()=>acao(t.id,"ap")},"✓ Aprovar"),
        h("button",{className:"btnd",style:{fontSize:12,padding:"7px 14px"},onClick:()=>acao(t.id,"rej")},"✗ Rejeitar")
      )
    );})
  );
}

// ── ALTERAR SENHA ─────────────────────────────────────────────────────────────
function AlterarSenha({user,setU,notify}){
  const[form,setForm]=useState({atual:"",nova:"",conf:""});
  const[sav,setSav]=useState(false);
  const sf=(k,v)=>setForm(f=>({...f,[k]:v}));
  async function salvar(){
    if(!form.atual){notify("Informe a senha atual.","err");return;}
    const hashAtual=await hashSenha(form.atual);
    const ok=(user.pw===hashAtual||user.pw===form.atual);
    if(!ok){notify("Senha atual incorreta.","err");return;}
    if(form.nova.length<6){notify("Mínimo 6 caracteres.","err");return;}
    if(form.nova!==form.conf){notify("Confirmação não confere.","err");return;}

// ── COMPETÊNCIA ───────────────────────────────────────────────────────────────
function Comp({comp,setComp,users,comps,setC,exc,setE,getR,notify}){
  const[confirm,setConfirm]=useState(false);
  const[sav,setSav]=useState(false);
  function nextComp(c){const[y,m]=c.split("-").map(Number);const d=new Date(y,m,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
  async function encerrar(){
    setSav(true);
    try{
      const nc=nextComp(comp);
      const rows=users.map(u=>{const r=getR(u.id,comp);return{comp,user_id:u.id,efetivos:r.ef,excedente:r.exc,total:r.total};});
      await sb("POST","competencias","",rows);
      const excRows=users.filter(u=>getR(u.id,comp).exc>0).map(u=>{const r=getR(u.id,comp);return{user_id:u.id,comp:nc,valor:r.exc};});
      if(excRows.length)await sb("POST","excedentes","on_conflict=user_id,comp",excRows);
      await sb("PATCH","config","chave=eq.comp_ativa",{valor:nc});
      const ne={...exc};users.forEach(u=>{const r=getR(u.id,comp);if(r.exc>0)ne[u.id+"_"+nc]=r.exc;});setE(ne);
      const snap={};users.forEach(u=>{snap[u.id]=getR(u.id,comp);});setC(p=>({...p,[comp]:snap}));
      setComp(nc);setConfirm(false);notify("Competência "+fmtComp(comp)+" encerrada!");
    }catch(e){notify("Erro: "+e.message,"err");}
    setSav(false);
  }
  const hist=Object.keys(comps).sort().reverse();
  return h("div",null,h("h2",{className:"ph"},"Gestão de Competência"),
    h("div",{className:"card",style:{padding:18,marginBottom:14}},
      h("div",{style:{fontWeight:700,fontSize:15,marginBottom:8}},"Competência Ativa: ",h("span",{style:{color:"#1d4ed8"}},fmtComp(comp))),
      h("p",{style:{color:"#64748b",fontSize:13,marginBottom:14}},"Encerrar salva snapshot, transfere excedentes e avança o período."),
      !confirm?h("button",{className:"btnd",onClick:()=>setConfirm(true)},"🔒 Encerrar "+fmtComp(comp))
        :h("div",{style:{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:8,padding:14}},
          h("p",{style:{color:"#dc2626",fontWeight:700,marginBottom:10}},"⚠️ Confirma? Ação irreversível."),
          h("div",{className:"btn-row"},h("button",{className:"btnd",onClick:encerrar,disabled:sav},sav?"Processando...":"Confirmar"),h("button",{className:"btns",onClick:()=>setConfirm(false)},"Cancelar"))
        )
    ),
    hist.length>0&&h("div",{className:"card"},h("div",{className:"card-head"},"Histórico ("+hist.length+")"),
      h("div",{className:"tbl-wrap"},h("table",null,
        h("thead",null,h("tr",null,["Competência","Colaboradores","Média","Status"].map(x=>h("th",{key:x},x)))),
        h("tbody",null,hist.map(c=>{const s=comps[c],ids=Object.keys(s);const med=ids.length?Math.round(ids.reduce((a,id)=>a+(s[id]?s[id].ef:0),0)/ids.length):0;return h("tr",{key:c},h("td",{style:{fontWeight:700,color:"#1d4ed8"}},fmtComp(c)),h("td",null,ids.length),h("td",{style:{fontWeight:700}},med),h("td",null,h(Bdg,{lbl:"Encerrada",cor:"#16a34a"})));})
        )

    const t2=Date.now();
    try{const r=await sb("GET","config","chave=eq.comp_ativa");checks.cfg={ok:Array.isArray(r)&&r.length>0,ms:Date.now()-t2,msg:"Configuração de competência"};}
    catch(e){checks.cfg={ok:false,ms:Date.now()-t2,msg:"Configuração",err:e.message};}
    checks.crypto={ok:typeof crypto!=="undefined"&&!!crypto.subtle,ms:0,msg:"Criptografia SHA-256"};
    checks.session={ok:true,ms:0,msg:"Sessão ativa"};
    setHC(checks);setChecking(false);
  }

  const totalU=users.length,ativos=users.filter(u=>u.ativo).length;
  const colabs=cols(),gestores=users.filter(u=>["gerente","encarregado","diretor"].includes(u.role));
  const totalT=trfs.length,aprov=trfs.filter(t=>t.status==="ap_ger").length;
  const pend=trfs.filter(t=>t.status==="pend"||t.status==="ap_enc").length;
  const rej=trfs.filter(t=>t.status==="rej").length;
  const aptosC=colabs.filter(u=>getR(u.id,comp).ef>=MINP).length;
  const T=totalT||1,pA=Math.round(aprov/T*100),pP=Math.round(pend/T*100),pR=Math.round(rej/T*100);
  const ranking=colabs.map(u=>({nome:u.nome.split(" ")[0]+" "+u.nome.split(" ").slice(-1)[0],ef:getR(u.id,comp).ef})).sort((a,b)=>b.ef-a.ef).slice(0,5);
  const maxEf=ranking[0]?.ef||1;
  const unidMap={};colabs.forEach(u=>{unidMap[u.unid]=(unidMap[u.unid]||0)+1;});
  const histC=Object.keys(comps).sort().slice(-6);
  const hcAll=hc?Object.values(hc):[];
  const hcOk=hcAll.filter(x=>x.ok).length;

  function Bar({label,val,max,cor}){
    const p=Math.min(Math.round(val/max*100),100);
    return h("div",{style:{marginBottom:10}},
      h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}},h("span",{style:{fontWeight:600}},label),h("span",{style:{color:cor,fontWeight:700}},val+" pts")),
      h("div",{style:{height:10,background:"#f1f5f9",borderRadius:5}},h("div",{style:{height:"100%",width:p+"%",background:cor,borderRadius:5,transition:"width .6s"}}))
    );
  }
  function PBar({label,val,pct,cor}){
    return h("div",{style:{marginBottom:8}},
      h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}},h("span",null,label),h("span",{style:{color:cor,fontWeight:700}},val+" ("+pct+"%)")),
      h("div",{style:{height:8,background:"#f1f5f9",borderRadius:4}},h("div",{style:{height:"100%",width:pct+"%",background:cor,borderRadius:4}}))
    );
  }

  return h("div",null,
    h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:10}},
      h("div",null,h("h2",{className:"ph",style:{margin:0}},"⚙️ Painel Master"),h("div",{style:{fontSize:11,color:"#64748b",marginTop:4}},"Atualizado: "+now.toLocaleString("pt-BR")+" • Produção")),
      h("button",{className:"btn",onClick:runHC,disabled:checking,style:{minWidth:160}},checking?"🔄 Verificando...":"🩺 Health Check")
    ),
    h("div",{className:"kgrid"},
      h(KCard,{icon:"👥",lbl:"Total Usuários",val:totalU,cor:"#1d4ed8"}),
      h(KCard,{icon:"✅",lbl:"Ativos",val:ativos,cor:"#16a34a"}),
      h(KCard,{icon:"📋",lbl:"Colaboradores",val:colabs.length,cor:"#7c3aed"}),
      h(KCard,{icon:"👔",lbl:"Gestores",val:gestores.length,cor:"#d97706"}),
      h(KCard,{icon:"📝",lbl:"Total Tarefas",val:totalT,cor:"#0891b2"}),
      h(KCard,{icon:"🏆",lbl:"Aptos "+fmtComp(comp),val:aptosC+"/"+colabs.length,cor:"#16a34a"}),
      h(KCard,{icon:"📅",lbl:"Hist. Competências",val:Object.keys(comps).length,cor:"#64748b"})
    ),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}},
      h("div",{className:"card"},
        h("div",{className:"card-head"},"📊 Status das Tarefas"),
        h("div",{style:{padding:16}},
          h("div",{style:{display:"flex",justifyContent:"center",marginBottom:16}},
            h("svg",{viewBox:"0 0 100 100",width:110,height:110},
              ...[
                {pct:pA,cor:"#16a34a",off:0},
                {pct:pP,cor:"#f59e0b",off:pA},
                {pct:pR,cor:"#dc2626",off:pA+pP},
              ].map(({pct,cor,off})=>{
                const r=38,circ=2*Math.PI*r,dash=circ*(pct/100);
                return h("circle",{key:cor,cx:50,cy:50,r,fill:"none",stroke:cor,strokeWidth:14,strokeDasharray:dash+" "+(circ-dash),strokeDashoffset:-(off/100)*circ,style:{transition:"stroke-dasharray .6s"}});
              }),
              h("text",{x:50,y:47,textAnchor:"middle",fontSize:15,fontWeight:"bold",fill:"#1e293b"},totalT),
              h("text",{x:50,y:60,textAnchor:"middle",fontSize:8,fill:"#64748b"},"tarefas")
            )
          ),
          h(PBar,{label:"✅ Aprovadas",val:aprov,pct:pA,cor:"#16a34a"}),
          h(PBar,{label:"⏳ Pendentes",val:pend,pct:pP,cor:"#f59e0b"}),
          h(PBar,{label:"❌ Rejeitadas",val:rej,pct:pR,cor:"#dc2626"})
        )
      ),
      h("div",{className:"card"},
        h("div",{className:"card-head",style:{display:"flex",justifyContent:"space-between"}},
          "🩺 Health Check",
          hc&&h("span",{style:{fontSize:11,fontWeight:700,color:hcOk===hcAll.length?"#16a34a":"#dc2626"}},hcOk+"/"+hcAll.length+" OK")
        ),
        h("div",{style:{padding:16}},
          !hc&&!checking&&h("div",{style:{textAlign:"center",color:"#94a3b8",padding:20}},h("div",{style:{fontSize:32,marginBottom:8}},"🩺"),h("div",{style:{fontSize:13}},"Clique em Health Check")),
          checking&&h("div",{style:{textAlign:"center",padding:24}},h("div",{className:"spinner",style:{margin:"0 auto 12px"}}),h("div",{style:{color:"#64748b"}},"Verificando...")),
          hc&&h("div",null,
            Object.values(hc).map((c,i)=>h("div",{key:i,style:{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid #f1f5f9"}},
              h("span",{style:{fontSize:18}},c.ok?"✅":"❌"),
              h("div",{style:{flex:1}},h("div",{style:{fontWeight:600,fontSize:13,color:c.ok?"#1e293b":"#dc2626"}},c.msg),c.err&&h("div",{style:{fontSize:11,color:"#dc2626"}},c.err)),
              c.ms>0&&h("span",{style:{fontSize:11,color:"#94a3b8",fontWeight:700}},c.ms+"ms")
            )),
            h("div",{style:{marginTop:10,padding:"8px 12px",background:hcOk===hcAll.length?"#f0fdf4":"#fef2f2",borderRadius:7,fontSize:12,fontWeight:700,color:hcOk===hcAll.length?"#16a34a":"#dc2626",textAlign:"center"}},
              hcOk===hcAll.length?"✅ Sistema 100% operacional":"⚠️ "+(hcAll.length-hcOk)+" serviço(s) com problema"
            )
          )
        )
      )
    ),
    h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}},
      h("div",{className:"card"},
        h("div",{className:"card-head"},"🏆 Top 5 — "+fmtComp(comp)),
        h("div",{style:{padding:16}},
          ranking.length===0?h("div",{style:{textAlign:"center",color:"#94a3b8",padding:16}},"Sem pontos registrados."):
          ranking.map((r,i)=>h(Bar,{key:i,label:(i===0?"🥇":i===1?"🥈":i===2?"🥉":"  "+(i+1)+".")+" "+r.nome,val:r.ef,max:maxEf,cor:i===0?"#f59e0b":i===1?"#94a3b8":i===2?"#b45309":"#1d4ed8"}))
        )
      ),
      h("div",{className:"card"},
        h("div",{className:"card-head"},"🏢 Colaboradores por Unidade"),
        h("div",{style:{padding:16}},
          Object.entries(unidMap).sort((a,b)=>b[1]-a[1]).map(([unid,cnt])=>{
            const cor=UNID_COR[unid]||"#64748b";
            const p=Math.round(cnt/colabs.length*100);
            return h("div",{key:unid,style:{marginBottom:10}},
              h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:3}},
                h("span",{style:{display:"flex",alignItems:"center",gap:6}},h("span",{style:{width:10,height:10,borderRadius:2,background:cor,display:"inline-block"}}),h("b",null,unid)),
                h("span",{style:{color:cor,fontWeight:700}},cnt)
              ),
              h("div",{style:{height:8,background:"#f1f5f9",borderRadius:4}},h("div",{style:{height:"100%",width:p+"%",background:cor,borderRadius:4}}))
            );
          })
        )
      )
    ),
    histC.length>0&&h("div",{className:"card",style:{marginBottom:14}},
      h("div",{className:"card-head"},"📅 Histórico de Competências"),
      h("div",{style:{padding:16}},
        h("div",{style:{display:"flex",alignItems:"flex-end",gap:8,height:120,marginBottom:8}},
          histC.map(c=>{
            const snap=comps[c]||{},ids=Object.keys(snap);
            const med=ids.length?Math.round(ids.reduce((s,id)=>s+(snap[id]?.ef||0),0)/ids.length):0;
            const p=Math.min(Math.round(med/MAXP*100),100);
            const apts=ids.filter(id=>snap[id]&&snap[id].ef>=MINP).length;
            return h("div",{key:c,style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}},
              h("div",{style:{fontSize:10,fontWeight:700,color:"#1d4ed8"}},med),
              h("div",{style:{width:"100%",background:"#f1f5f9",borderRadius:4,height:80,display:"flex",alignItems:"flex-end"}},
                h("div",{style:{width:"100%",height:p+"%",background:"linear-gradient(180deg,#60a5fa,#1d4ed8)",borderRadius:4,minHeight:4}})
              ),
              h("div",{style:{fontSize:9,color:"#64748b",textAlign:"center"}},fmtComp(c)),
              h("div",{style:{fontSize:9,color:"#16a34a",fontWeight:700}},apts+" aptos")
            );
          })
        ),
        h("div",{style:{fontSize:11,color:"#94a3b8",textAlign:"center"}},"Média de pontos efetivos por competência")
      )
    ),
    h("div",{className:"card"},
      h("div",{className:"card-head"},"ℹ️ Informações do Sistema"),
      h("div",{style:{padding:16}},
        h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:10}},
          [
            {icon:"🌐",label:"Ambiente",val:"Produção"},
            {icon:"☁️",label:"Hospedagem",val:"Vercel"},
            {icon:"🗄️",label:"Banco",val:"Supabase (PostgreSQL)"},
            {icon:"🔒",label:"Segurança",val:"SHA-256 + Domínio restrito"},
            {icon:"📱",label:"Interface",val:"Responsiva Web/Mobile"},
            {icon:"🔐",label:"Proteção",val:"XSS + SQL Injection"},
            {icon:"👤",label:"Usuários",val:totalU+" ("+ativos+" ativos)"},
            {icon:"📋",label:"Competência Ativa",val:fmtComp(comp)},
            {icon:"📊",label:"Competências Encerradas",val:Object.keys(comps).length},
            {icon:"✅",label:"Tarefas Aprovadas",val:aprov},
          ].map(item=>h("div",{key:item.label,style:{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:"#f8fafc",borderRadius:8,border:"1px solid #e2e8f0"}},
            h("span",{style:{fontSize:20}},item.icon),
            h("div",null,h("div",{style:{fontSize:10,color:"#64748b"}},item.label),h("div",{style:{fontWeight:700,fontSize:13}},item.val))
          ))
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
